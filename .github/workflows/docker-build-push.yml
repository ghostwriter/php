name: Docker CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - 'v*'
      - main
  schedule:
    - cron: '0 * * * *' # Runs hourly updates for the latest PHP versions and images

permissions:
  packages: write

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  SUPPORTED_PLATFORMS: 'linux/amd64,linux/arm64,linux/arm/v7'
  DOCKER_IMAGE: 'ghcr.io/ghostwriter/php'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    container:
      image: php:8.5-cli-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(php script/matrix.php)" >> $GITHUB_OUTPUT

  production:
    needs: [matrix]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # 4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.repository_owner }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # 4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # 4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # 6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: type=raw,value=${{ matrix.version }}-${{ matrix.variant }}

      - name: Build and push PHP ${{ matrix.version }}-${{ matrix.variant }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # 7.3.0
        continue-on-error: ${{ matrix.continue-on-error }}
        with:
          cache-from: type=local,scope=${{ env.DOCKER_IMAGE }}:${{ matrix.version }}-${{ matrix.variant }},src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,scope=${{ env.DOCKER_IMAGE }}:${{ matrix.version }}-${{ matrix.variant }},dest=${{ runner.temp }}/.buildx-cache-new,mode=max
          # cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}
          # cache-to: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }},mode=max
          file: ${{ matrix.variant }}/Dockerfile
          platforms: ${{ env.SUPPORTED_PLATFORMS }}
          push: ${{ github.repository_owner == github.actor }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            PHP_VARIANT=${{ matrix.variant }}

        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

  development:
    needs: [matrix, production]
    if: ${{ matrix.variant == 'cli' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # 4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.repository_owner }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # 4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # 4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # 6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: type=raw,value=${{ matrix.version }}

      - name: Build and push PHP ${{ matrix.version }} image with Code Coverage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # 7.3.0
        with:
          cache-from: type=local,scope=${{ env.DOCKER_IMAGE }}:${{ matrix.version }}-${{ matrix.variant }}-dev,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,scope=${{ env.DOCKER_IMAGE }}:${{ matrix.version }}-${{ matrix.variant }}-dev,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
          # cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-dev
          # cache-to: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-dev,mode=max
          file: development.Dockerfile
          platforms: ${{ env.SUPPORTED_PLATFORMS }}
          push: ${{ github.repository_owner == github.actor }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            PHP_VARIANT=${{ matrix.variant }}
        env:
          XDEBUG_ENABLED: 'true'

        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache
